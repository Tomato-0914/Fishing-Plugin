# ===== 钓鱼插件配置 =====
# 修改请在锅巴里操作，或复制本文件到 config/config/config.yaml 后修改（只需写要改的字段）

# 插件总开关
enable: true

# 存档方式（修改后需重启）
#   db   = SQLite 数据库 data/fishing.db（推荐），需要 sqlite3 或 Node ≥ 22.5，都不可用时自动退回 yaml
#   yaml = 每人一个 data/Fishing_<QQ号>.yaml
# 从 yaml 切到 db 时会自动导入旧存档，原文件移到 data/yaml_backup_<时间>/
storage: db

# 群黑名单 / 白名单（白名单不为空时只在白名单群可用）
blackGroups: []
whiteGroups: []

# 发送 QQBot 按钮（仅 QQBot 协议生效，其他协议自动忽略）
button: true

# 图片渲染失败时退回文字消息
textFallback: true

fishing:
  # 咬钩等待时间（秒），在区间内随机，越靠近中间越常见
  biteMin: 3
  biteMax: 18
  # 咬钩后多少秒内必须收杆，超时判定“鱼跑了”
  reelWindow: 15
  # 一次钓鱼结束后“挂鱼饵”的时间（秒）
  cooldown: 10
  # 1 阶鱼护的容量（鱼护每高一阶 +500、强化每级 +50）
  bagLimit: 2000
  # 十连钓鱼：一次抛出的竿数、每天可用次数（0 点重置）、两次之间的最短间隔（秒）
  # 鱼饵或鱼护空间不够时有多少钓多少；#钓鱼 单次抛竿不限次数
  multiCount: 10
  multiDaily: 100
  multiCooldown: 30
  # 百连钓鱼：需要角色等级 hundredLevel（25 级 = 解锁第 6 阶渔具）
  hundredCount: 100
  hundredDaily: 10
  hundredCooldown: 60
  hundredLevel: 25
  # 千连钓鱼：60 级解锁，每天 3 次，两次之间间隔 1 小时
  thousandCount: 1000
  thousandDaily: 3
  thousandCooldown: 3600
  thousandLevel: 60
  # 一次十连 / 百连 / 千连（整次）碰到保护鱼类的概率（%），每竿概率按竿数自动换算，按物种比例分配
  #   默认按“每天次数用满时，平均 3~4 天遇到一次”设定：十连 0.35（100 次/天）、百连 3.5（10 次/天）、千连 10（3 次/天）
  #   误钓后照常罚款、禁渔，剩下的竿作废，鱼饵不退；每个群每天最多钓到 protectedPenalty.groupDailyMax 条
  multiProtected: 0.35
  hundredProtected: 3.5
  thousandProtected: 10

# 概率 V2：普通至神话的全局基础概率为 0，鱼竿及培养决定条件品级分布。
# 空军、垃圾、隐藏款、保护鱼类单独计算；鱼获品级占剩余概率。
probability:
  mode: gear
  empty: 15     # 什么都没钓到
  junk: 20      # 海洋垃圾（售价 0）
  N: 0         # 普通：由渔具决定
  R: 0         # 高级：由渔具决定
  SR: 0        # 稀有：由渔具决定
  SSR: 0       # 神器：由渔具决定
  UR: 0        # 传说：由渔具决定
  EP: 0        # 史诗：由渔具决定
  MR: 0        # 神话：由渔具决定
  # 隐藏款，单独设置概率（%），不受渔具和称号影响
  hidden:
    people_fragment: 0.05   # 人民碎片
    ocean_heart: 0.01       # 海洋之心
    paimon: 0.02            # 派蒙
  # 保护鱼类：误钓会受罚（见 protectedPenalty），单独设置概率（%），不受渔具和称号影响
  protected:
    chinese_sturgeon: 0.1   # 中华鲟
    finless_porpoise: 0.05  # 长江江豚
    chinese_sucker: 0.08    # 胭脂鱼
    roughskin_sculpin: 0.08 # 松江鲈
    hawksbill: 0.04         # 玳瑁

# 误钓保护鱼类的惩罚：保护鱼类被放生，钓鱼人被警察带走（禁渔时长，分钟）并罚款
#   goldRate：按当前金币的百分比罚款（%），gold 为罚款上限；goldRate 为 0 时固定罚 gold
#   金币不足时扣到 0 为止
#   groupDailyMax：每个群每天最多钓到几条保护鱼类（群里所有人合计，私聊按个人单独算），达到后本群当天不会再出现（0 为不限制）
protectedPenalty:
  groupDailyMax: 5
  banMinutes: 60
  goldRate: 5
  gold: 10000

# 角色升级节奏（宠物经验与角色实际获得的经验相同，一起受影响）
#   默认按“每天次数用满的新玩家约 45 天满级”设定：Lv25 约第 4 天、Lv60 约第 15 天、Lv80 约第 25 天
#   曲线调整前已经达到的等级会作为保底，不会掉级
level:
  curveFrom: 60        # 从这一级以后，每级所需经验逐级增加
  curveGrowth: 0.08    # 每多一级再多 8%（Lv61 为旧版的 1.08 倍，Lv100 为 4.2 倍）；Lv100 总经验约 53 万
  dailySoft: 6000      # 每天前 6000 经验全额获得
  softRate: 20         # 超出 dailySoft 的部分只按 20% 计算
  dailyMax: 15000      # 每天最多获得 15000 经验

# 宠物（进化线与技能见 pets.yaml）
pet:
  unlockLevel: 10        # 角色等级达到后开放宠物商店
  price: 100000          # 一阶宠物价格（金币）
  maxLevel: 100
  xpFactor: 40           # 宠物每级所需经验 = 角色的 xpFactor / 25 倍（默认 1.6 倍）；宠物经验 = 角色同时获得的经验
  stageLevels: [1, 20, 40, 60, 80]   # 一 ~ 五阶的起始等级；四阶开始（Lv60）需要玩家选择进化方向
  levelGrowth: 2         # 技能解锁后每升一级，提升基础值的 %（Lv1 解锁的技能到 Lv100 约为基础值的 3 倍）
  lineGuardPerLevel: 0.3 # 所有宠物的天赋「护线」：每级断线概率 -0.3%（Lv100 为 -30%）
  switchPerDay: 1        # 每天可更换出战宠物的次数（没有出战宠物时不计次数）
  satiety:
    max: 100
    hungry: 30           # 饱食度不高于此值时饥饿，所有技能失效
    warn: 50             # 低于此值时在钓鱼结果里提醒喂食
    active: 1            # 出战宠物每小时消耗的饱食度（基础值）
    rest: 0.2            # 休息中的宠物每小时消耗的饱食度（基础值）
    # 一 ~ 五阶的消耗比例（%，乘在上面的基础值上）：阶段越低消耗越少
    #   默认按“每天钓 1000 竿、穿刚解锁的那一阶渔具”配平，每个阶段口粮开销约为宠物多赚金币的一半，不会亏
    #   出战每天约消耗：一阶 0.05、二阶 0.24、三阶 1.2、四阶 6、五阶 12（口粮 1 万 / 5 饱食度时，五阶每天约 2.4 万）
    stageRate: [0.2, 1, 5, 25, 50]
  food:
    price: 10000         # 宠物口粮单价（金币）
    value: 5             # 每份口粮恢复的饱食度（最多喂到上限，多余的不扣费）
  recall:
    price: 1000000       # 饱食度降到 0 宠物离家出走后，寻回的价格
    days: 7              # 离家出走后多少天内可以寻回，超过后彻底失去
  oath:
    price: 100000000     # 永恒誓约（#永恒誓约 名称）：仅限满级宠物，缔结后饱食度永远 100，不再饥饿、不会离家出走

# 派蒙：第一次钓到获得称号「最好的伙伴」，之后每次钓到送的谢礼（金币）
paimonGift: 520

# 旧概率下限（仅旧版 mode 下有效；gear 模式不使用）
limits:
  empty: 3
  junk: 5
  N: 5
  R: 8
  SR: 15

# 鱼的体型：出现概率（%）与售价倍率
size:
  small:  { label: 小,   chance: 53, price: 0.8 }
  medium: { label: 中,   chance: 34, price: 1.0 }
  large:  { label: 大,   chance: 10, price: 1.5 }
  xlarge: { label: 超大, chance: 3,  price: 2.5 }

# 鱼饵：每次抛竿消耗 1 个
bait:
  # 第一次钓鱼赠送的鱼饵
  initial: 10
  # 普通饵单价（金币）
  price: 2
  # 其他鱼饵的单价（金币），按 shop.yaml 中鱼饵的 id 填写；不填则使用 shop.yaml 中的价格
  # 例：prices: { worm: 4, scent: 6, shrimp: 10, golden: 25 }
  prices: {}
  # 单次最多购买数量
  maxBuy: 999
  # 救济：鱼饵用完、金币不够买、鱼护也没有可卖的鱼时，每天可领取一次的免费鱼饵（0 为关闭）
  relief: 5

# 每日打卡：每天一次，随机幸运值 0~100，当天的钓鱼概率会受幸运等级轻微影响
checkin:
  # 打卡奖励：鱼饵阶位 = 穿戴渔具的最高阶（送的一定能用），按幸运值决定数量，运气差时降阶（最低 1 阶）
  #   幸运值 ≥ min 时送“渔具阶位 - drop”阶鱼饵 × count；不写 rewards 时使用下面的默认值
  rewards:
    - { min: 90, drop: 0, count: 10 }   # 大吉：本阶 ×10
    - { min: 70, drop: 0, count: 6 }    # 吉：本阶 ×6
    - { min: 30, drop: 0, count: 4 }    # 平：本阶 ×4
    - { min: 10, drop: 1, count: 4 }    # 凶：低一阶 ×4
    - { min: 0,  drop: 2, count: 3 }    # 大凶：低两阶 ×3
  # 运势不改变鱼获品级，只影响空军/垃圾与其他非品级效果
  # 当天首个幸运值 ≥ 此值的人成为「今日欧皇」
  luckyKing: 95
  # 当天首个幸运值 ≤ 此值的人成为「今日非酋」
  unluckyKing: 5
  # 幸运值 ≤ 此值时先“劝退”一次，需再发一遍确认（0 为关闭）
  confirmLow: 10
  # 幸运等级（按 min 从高到低匹配），effects 与称号效果写法相同，负数表示反向
  tiers:
    - { min: 90, name: 大吉, emoji: 🌟, effects: { emptyReduce: 2 } }
    - { min: 70, name: 吉,   emoji: 🍀, effects: { emptyReduce: 1 } }
    - { min: 30, name: 平,   emoji: 🌤️, effects: {} }
    - { min: 10, name: 凶,   emoji: 🌧️, effects: { emptyReduce: -2 } }
    - { min: 0,  name: 大凶, emoji: ⛈️, effects: { emptyReduce: -3, junkReduce: -2 } }

# 钓到「人民碎片」后警局奖励的金币
policeReward: 15000

# 排行榜
rank:
  # 群排行展示人数
  groupSize: 10
  # 总榜展示人数
  totalSize: 30

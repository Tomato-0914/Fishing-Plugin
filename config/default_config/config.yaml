# ===== 钓鱼插件配置 =====
# 修改请在锅巴里操作，或复制本文件到 config/config/config.yaml 后修改（只需写要改的字段）

# 插件总开关
enable: true

# 群黑名单 / 白名单（白名单不为空时只在白名单群可用）
blackGroups: []
whiteGroups: []

# 发送 QQBot 按钮（仅 QQBot 协议生效，其他协议自动忽略）
button: true

# 图片渲染失败时退回文字消息
textFallback: true

fishing:
  # 咬钩等待时间（秒），在区间内随机，越靠近中间越常见
  biteMin: 3
  biteMax: 18
  # 咬钩后多少秒内必须收杆，超时判定“鱼跑了”
  reelWindow: 15
  # 一次钓鱼结束后“挂鱼饵”的时间（秒）
  cooldown: 10
  # 鱼护（背包）容量
  bagLimit: 200

# 各结果的概率（%），总和建议为 100，不为 100 时按比例换算
probability:
  empty: 15     # 什么都没钓到
  junk: 20      # 海洋垃圾（售价 0）
  N: 30         # 普通
  R: 18         # 优良
  SR: 10        # 稀有
  SSR: 5        # 史诗
  UR: 1.94      # 传说
  # 隐藏款，单独设置概率（%）
  hidden:
    people_fragment: 0.05   # 人民碎片
    ocean_heart: 0.01       # 海洋之心

# 鱼的体型：出现概率（%）与售价倍率
size:
  small:  { label: 小, chance: 55, price: 0.8 }
  medium: { label: 中, chance: 35, price: 1.0 }
  large:  { label: 大, chance: 10, price: 1.5 }

# 钓到「人民碎片」后警局奖励的金币
policeReward: 5000

# 排行榜
rank:
  # 群排行展示人数
  groupSize: 10
  # 总榜展示人数
  totalSize: 30

# ===== 钓鱼插件配置 =====
# 修改请在锅巴里操作，或复制本文件到 config/config/config.yaml 后修改（只需写要改的字段）

# 插件总开关
enable: true

# 存档方式（修改后需重启）
#   db   = SQLite 数据库 data/fishing.db（推荐），需要 sqlite3 或 Node ≥ 22.5，都不可用时自动退回 yaml
#   yaml = 每人一个 data/Fishing_<QQ号>.yaml
# 从 yaml 切到 db 时会自动导入旧存档，原文件移到 data/yaml_backup_<时间>/
storage: db

# 群黑名单 / 白名单（白名单不为空时只在白名单群可用）
blackGroups: []
whiteGroups: []

# 发送 QQBot 按钮（仅 QQBot 协议生效，其他协议自动忽略）
button: true

# 图片渲染失败时退回文字消息
textFallback: true

fishing:
  # 咬钩等待时间（秒），在区间内随机，越靠近中间越常见
  biteMin: 3
  biteMax: 18
  # 咬钩后多少秒内必须收杆，超时判定“鱼跑了”
  reelWindow: 15
  # 一次钓鱼结束后“挂鱼饵”的时间（秒）
  cooldown: 10
  # 鱼护（背包）容量
  bagLimit: 200
  # 抛竿时附带的配图：插件目录下的相对路径或绝对路径，留空则不发送
  castImage: resources/img/cast.jpg
  # 十连钓鱼：一次抛出的竿数，以及结束后的挂鱼饵时间（秒）
  multiCount: 10
  # 每天可以十连的次数（0 点重置）；测试阶段提高至 100 次，正式运营可改回 10
  multiDaily: 100
  # 单次钓鱼额外获得 1 次十连机会的概率（%），鱼钩会提高这个概率；额外机会不会过期，最多存 multiBonusMax 次
  multiTicketChance: 2
  multiBonusMax: 50
  # 两次十连之间的最短间隔（秒），防刷屏
  multiCooldown: 30
  # 十连钓鱼的配图，留空则不发送
  multiImage: resources/img/multi.jpg

# 各结果的概率（%），总和建议为 100，不为 100 时按比例换算
probability:
  empty: 15     # 什么都没钓到
  junk: 20      # 海洋垃圾（售价 0）
  N: 29.13      # 普通
  R: 18         # 高级
  SR: 10        # 稀有
  SSR: 5        # 神器
  UR: 1.94      # 传说
  EP: 0.4       # 史诗
  MR: 0.1       # 神话
  # 隐藏款，单独设置概率（%），不受渔具和称号影响
  hidden:
    people_fragment: 0.05   # 人民碎片
    ocean_heart: 0.01       # 海洋之心
    paimon: 0.02            # 派蒙
  # 保护动物：误钓会受罚（见 protectedPenalty），单独设置概率（%），不受渔具和称号影响
  protected:
    chinese_sturgeon: 0.1   # 中华鲟
    finless_porpoise: 0.05  # 长江江豚
    chinese_sucker: 0.08    # 胭脂鱼
    roughskin_sculpin: 0.08 # 松江鲈
    hawksbill: 0.04         # 玳瑁

# 误钓保护动物的惩罚：禁渔时长（分钟）与罚款（金币不足时扣到 0 为止）
protectedPenalty:
  banMinutes: 60
  gold: 10000

# 派蒙：第一次钓到获得称号「最好的伙伴」，之后每次钓到送的谢礼（金币）
paimonGift: 520

# 概率下限（%）：称号、打卡、渔具叠加后不会低于这些值
limits:
  empty: 3
  junk: 5
  N: 5
  R: 8
  SR: 15

# 鱼的体型：出现概率（%）与售价倍率
size:
  small:  { label: 小,   chance: 53, price: 0.8 }
  medium: { label: 中,   chance: 34, price: 1.0 }
  large:  { label: 大,   chance: 10, price: 1.5 }
  xlarge: { label: 超大, chance: 3,  price: 2.5 }

# 鱼饵：每次抛竿消耗 1 个
bait:
  # 第一次钓鱼赠送的鱼饵
  initial: 10
  # 普通饵单价（金币）
  price: 2
  # 其他鱼饵的单价（金币），按 shop.yaml 中鱼饵的 id 填写；不填则使用 shop.yaml 中的价格
  # 例：prices: { worm: 4, scent: 6, shrimp: 10, golden: 25 }
  prices: {}
  # 单次最多购买数量
  maxBuy: 999
  # 救济：鱼饵用完、金币不够买、鱼护也没有可卖的鱼时，每天可领取一次的免费鱼饵（0 为关闭）
  relief: 5

# 每日打卡：每天一次，随机幸运值 0~100，当天的钓鱼概率会受幸运等级轻微影响
checkin:
  # 打卡奖励按幸运值决定（不再单独配置）：每 10 点一档，1~10 送 1 级鱼饵，11~20 送 2 级 … 91~100 送 10 级，
  # 数量为在本档的位置（1~10 个），幸运值 0 不送。例：7 → 1 级 ×7，54 → 6 级 ×4，100 → 10 级 ×10
  # 当天首个幸运值 ≥ 此值的人成为「今日欧皇」
  luckyKing: 95
  # 当天首个幸运值 ≤ 此值的人成为「今日非酋」
  unluckyKing: 5
  # 幸运值 ≤ 此值时先“劝退”一次，需再发一遍确认（0 为关闭）
  confirmLow: 10
  # 幸运等级（按 min 从高到低匹配），effects 与称号效果写法相同，负数表示反向
  tiers:
    - { min: 90, name: 大吉, emoji: 🌟, effects: { rareBoost: 10, emptyReduce: 2 } }
    - { min: 70, name: 吉,   emoji: 🍀, effects: { rareBoost: 5 } }
    - { min: 30, name: 平,   emoji: 🌤️, effects: {} }
    - { min: 10, name: 凶,   emoji: 🌧️, effects: { emptyReduce: -2 } }
    - { min: 0,  name: 大凶, emoji: ⛈️, effects: { emptyReduce: -3, junkReduce: -2 } }

# 钓到「人民碎片」后警局奖励的金币
policeReward: 5000

# 排行榜
rank:
  # 群排行展示人数
  groupSize: 10
  # 总榜展示人数
  totalSize: 30

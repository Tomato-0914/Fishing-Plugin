# ===== 称号 =====
# 每个称号分 Ⅰ / Ⅱ / Ⅲ 三级，达到 need 即获得对应等级；同一称号只按最高一级生效（不与低级叠加），不同称号之间效果叠加
# 称号按累计统计计算，统计只增不减，所以获得后不会失去
# stat 可用：casts 抛竿次数 / catches 钓到的鱼 / junkCleaned 清理垃圾 / fails 空军+跑鱼+收杆过早
#            police 人民碎片次数 / heart 海洋之心次数 / ur 传说鱼次数 / earned 累计钓获价值
#            dex 图鉴中已收集的鱼类种数（need 写 all 表示集齐） / checkinDays 累计打卡天数
# desc 中的 {n} 会替换成该级的 need
# effects 写法与渔具相同：boostN ~ boostUR（分档加成，从低档扣除）、rareBoost、largeBoost、emptyReduce、junkReduce、
#   biteReduce、cooldown（挂鱼饵 -N 秒）、reelWindow、sellBonus（出售金币 +N%，可以超过 100%）等

- id: veteran
  name: 钓鱼佬
  emoji: 🌱
  stat: casts
  desc: 累计抛竿 {n} 次
  tiers:
    - { need: 100,   effects: { biteReduce: 1, cooldown: 1 } }
    - { need: 3000,  effects: { biteReduce: 2, cooldown: 2 } }
    - { need: 50000, effects: { biteReduce: 3, cooldown: 3 } }

- id: skilled
  name: 熟练钓手
  emoji: 🎣
  stat: catches
  desc: 累计钓到 {n} 条鱼
  tiers:
    - { need: 100,   effects: { boostR: 2, boostSR: 1 } }
    - { need: 3000,  effects: { boostSR: 3, boostSSR: 1 } }
    - { need: 50000, effects: { boostSSR: 3, boostUR: 1 } }

- id: guardian
  name: 海洋卫士
  emoji: 🌊
  stat: junkCleaned
  desc: 累计清理 {n} 件海洋垃圾
  tiers:
    - { need: 50,    effects: { junkReduce: 3 } }
    - { need: 1000,  effects: { junkReduce: 6, boostR: 1 } }
    - { need: 10000, effects: { junkReduce: 10, boostSR: 2 } }

- id: airforce
  name: 空军司令
  emoji: ✈️
  stat: fails
  desc: 累计空军 / 跑鱼 / 收杆过早 {n} 次
  tiers:
    - { need: 100,   effects: { emptyReduce: 3, reelWindow: 2 } }
    - { need: 2000,  effects: { emptyReduce: 6, reelWindow: 4 } }
    - { need: 20000, effects: { emptyReduce: 9, reelWindow: 6 } }


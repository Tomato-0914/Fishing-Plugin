# ===== 物品池 =====
# 修改请复制本文件到 config/config/items.yaml（整份替换默认物品池）
# rarity: junk 垃圾 / N 普通 / R 高级 / SR 稀有 / SSR 神器 / UR 传说 / EP 史诗 / MR 神话 / hidden 隐藏 / protected 保护动物
# price: 中体型基础售价（金币），小/大体型按 config.yaml 中 size 倍率换算
# weight: [最小, 最大] 重量（kg），按体型落在不同区间
# chance: 同稀有度内的相对权重，默认 1
# habitat: 栖息地；intro: 图鉴中的详细介绍（#钓鱼图鉴 名称 查看）
# 保护动物（protected）只作为惩罚出现：钓到后自动放生，并按 config.yaml 的 protectedPenalty 禁渔、扣金币


      - { name: 碳纤竿,   price: 2000,  effects: { boostN: 3, boostR: 1.8, largeBoost: 5 }, desc: 碳素竿身，又轻又灵敏 }
      - { name: 高模碳竿, price: 6000,  effects: { boostN: 3, boostR: 3, boostSR: 0.9, largeBoost: 8 }, desc: 高模量碳素，硬而轻，遛大鱼不费劲 }
      - { name: 星陨竿,   price: 18000, effects: { boostN: 1.8, boostR: 3.6, boostSR: 3, boostSSR: 0.6, largeBoost: 12 }, desc: 传说竿芯用陨铁锻造，握在手里隐隐发热 }
      - { name: 流光竿,   price: 25000, effects: { boostN: 1.2, boostR: 3.6, boostSR: 5.4, boostSSR: 1.5, boostUR: 0.2, largeBoost: 14 }, desc: 甩竿时竿身会拖出一道淡淡的光痕 }
      - { name: 玄冰竿,   price: 35000, effects: { boostR: 3, boostSR: 7.8, boostSSR: 3, boostUR: 0.6, largeBoost: 15 }, desc: 极北寒冰磨成的竿身，大鱼一碰就冷静下来 }
      - { name: 雷霆竿,   price: 48000, effects: { boostR: 2.4, boostSR: 10.2, boostSSR: 5.4, boostUR: 1.2, largeBoost: 17 }, desc: 起竿时隐约有雷声，水底的大家伙都被震了出来 }
      - { name: 凤翎竿,   price: 64000, effects: { boostR: 1.8, boostSR: 12.6, boostSSR: 8.4, boostUR: 2.4, largeBoost: 18 }, desc: 竿梢缀着一根凤凰尾羽，轻得几乎感觉不到 }
      - { name: 龙骨神竿, price: 85000, effects: { boostR: 1.2, boostSR: 15, boostSSR: 11.4, boostUR: 4.2, largeBoost: 20 }, desc: 传说用龙脊骨雕成，四海的鱼都认得它 }

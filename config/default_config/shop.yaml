# 断线：收杆时大鱼可能挣断鱼线跑掉（%），鱼线的 lineGuard 按比例降低
lineBreak:
  SSR: 6        # 神器
  UR: 12        # 传说
  EP: 16        # 史诗
  MR: 20        # 神话
  large: 4      # 大体型额外增加（垃圾、隐藏款、保护动物不会断线）
  xlarge: 8     # 超大体型额外增加

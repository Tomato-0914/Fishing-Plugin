# ===== 新版渔具工坊（20 阶） =====
# 旧 gear 节点仅用于旧存档回收价格，不能再用于购买/穿戴。
gearV2:
  prices: [200, 350, 600, 950, 1400, 1950, 2600, 3350, 4200, 5150, 6200, 7350, 8600, 9950, 11400, 12950, 14600, 16350, 18200, 20150]
  enhanceCostFactor: 50
  forgeCostFactor: 100
  # 每行：[目标等级上限, 基础成功率(%), 每次失败补偿(百分点)]
  # 单件装备的强化与锻造补偿分别累计，最多额外 +50 个百分点；成功清零。
  rates:
    enhance:
      - [3, 95, 2]
      - [6, 85, 3]
      - [9, 70, 5]
      - [12, 50, 7]
      - [14, 30, 10]
      - [15, 15, 10]
    forge:
      - [2, 90, 3]
      - [4, 75, 5]
      - [6, 55, 7]
      - [7, 35, 10]
      - [8, 20, 10]

# ===== 渔具工坊（gear：渔具升级）与鱼饵商店（baits：鱼饵） =====
# 修改请复制本文件到 config/config/shop.yaml，只写要改的部分即可（列表会整段替换）
# 渔具为升级制：每类 10 级，Lv1 免费，必须拥有上一级才能购买下一级，购买后自动装备
# effects 写法与称号相同：
#   boostN / boostR / boostSR / boostSSR / boostUR  普通 / 高级 / 稀有 / 神器 / 传说概率（另有 boostEP 史诗、boostMR 神话） +N 个百分点，
#     从比它低的档位按 空军 → 垃圾 → 普通 → 高级 的顺序扣除（不低于 config.yaml 的 limits 下限），稀有以上不会被扣
#   rareBoost 稀有以上概率 +N%（相对值）  largeBoost 大体型概率 +N%
#   emptyReduce 空军概率 -N%              junkReduce 垃圾概率 -N%
#   reelWindow 收杆时间 +N 秒              biteReduce 咬钩等待 -N 秒
#   lineGuard 断线概率 -N%（相对值）        sellBonus 出售金币 +N%
#   holdChance 咬钩后没及时收杆时，N% 概率鱼钩仍把鱼钩住（不跑鱼）
#   multiTicket 单次钓鱼额外获得十连机会的概率 +N%（加在 config.yaml 的 multiTicketChance 上）
# 鱼护的 capacity 为容量；Lv1 鱼护的容量取 config.yaml 中的 fishing.bagLimit


    - { icon: 🏷️, title: "#出售 名称 [数量]", desc: 出售指定鱼获，不写数量卖全部 }
    - { icon: 💰, title: "#一键出售", desc: 出售全部有价值的鱼获 }
    - { icon: 🗑️, title: "#丢弃垃圾", desc: 集中清理海洋垃圾，攒够数量有称号 }
    - { icon: 👤, title: "#钓鱼信息", desc: 金币、统计与最大一条鱼 }

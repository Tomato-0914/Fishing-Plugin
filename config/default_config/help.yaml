    - { icon: 🗓️, title: "#钓鱼周/月排行榜", desc: 本群本周 / 本月排行 }
    - { icon: 🌏, title: "#钓鱼总榜", desc: 所有群累计排行前 30 名 }
    - { icon: 🏅, title: "#我的称号", desc: 称号进度，拥有即永久生效 }
- group: ⚙️ 管理
  list:
    - { icon: 🔄, title: "#钓鱼更新", desc: 拉取最新版本（主人） }

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="{{_res}}/common/common.css" />
  <link rel="stylesheet" href="{{_res}}/dex/dex.css" />
</head>
<body class="{{theme}}">
  <div class="container">
    <div class="head">
      <div class="logo">📚</div>
      <div>
        <div class="title">{{name}} 的钓鱼图鉴</div>
        <div class="sub">鱼类收集 {{got}}/{{total}}</div>
      </div>
    </div>
    {{each groups g}}
    <div class="card">
      <div class="card-title"><span class="tag" style="background: {{g.color}}">{{g.label}}</span></div>
      <div class="grid">
        {{each g.list i}}
        <div class="cell {{i.got ? '' : 'lock'}}">
          <div class="emoji">{{i.emoji}}</div>
          <div class="name">{{i.name}}</div>
          <div class="count">{{i.got ? '×' + i.count : '未解锁'}}</div>
        </div>
        {{/each}}
      </div>
    </div>
    {{/each}}
    <div class="footer">集齐全部鱼类可获得称号【📖 图鉴大师】</div>
  </div>
</body>
</html>

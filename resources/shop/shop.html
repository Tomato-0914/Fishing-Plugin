<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="{{_res}}/common/common.css" />
  <link rel="stylesheet" href="{{_res}}/common/tackle.css" />
</head>
<body class="{{theme}}">
  <div class="container">
    <div class="head">
      <div class="logo">🏪</div>
      <div>
        <div class="title">渔具商店</div>
        <div class="sub">{{name}} · 👛 {{gold}} 金币</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🪱 鱼饵 <span class="muted small">每竿消耗 1 个，同时只用一种，用完自动换成有库存的</span></div>
      {{each baits b}}
      <div class="bait {{b.current ? 'using' : ''}}">
        <div class="b-emoji">{{b.emoji}}</div>
        <div class="b-info">
          <div class="b-name">{{b.name}}{{if b.current}}<span class="using-tag">使用中</span>{{/if}}</div>
          <div class="small">{{b.text == '无' ? '无特殊效果' : b.text}}</div>
          <div class="muted small">{{b.desc}}</div>
        </div>
        <div class="b-count muted">库存 {{b.count}}</div>
        <div class="b-price">{{b.price}} <small>金币</small></div>
      </div>
      {{/each}}
    </div>
    <div class="footer">#购买鱼饵 种类 数量 · #使用鱼饵 种类 · 升级渔具请到 #渔具工坊</div>
  </div>
  <script src="{{_res}}/common/twemoji.min.js"></script>
  <script src="{{_res}}/common/emoji.js"></script>
</body>
</html>
